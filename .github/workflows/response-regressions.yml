name: Response regression tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'release/*']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v7
      - name: Run response tests with AddressSanitizer and UBSan
        env:
          CXX: ${{ matrix.cxx }}
        run: python3 -m unittest discover -s tests -p 'test_response_*.py' -v
